<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineup Integration Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            border: 1px solid #3a3a3a;
        }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .status.pending { background: #3a3a3a; }
        .status.success { background: #064e3b; border: 1px solid #4ade80; }
        .status.error { background: #7f1d1d; border: 1px solid #f87171; }
    </style>
</head>
<body>
    <h1>🧪 Lineup Integration Test</h1>
    <p class="info">This page tests the Supabase integration for team lineups.</p>
    
    <div class="test-section">
        <h2>Step 1: Check Migration Status</h2>
        <div id="migration-status" class="status pending">Checking if table exists...</div>
        <button onclick="checkMigration()">Check Migration</button>
    </div>

    <div class="test-section">
        <h2>Step 2: Test Save & Load</h2>
        <div id="save-load-status" class="status pending">Ready to test...</div>
        <button onclick="testSaveLoad()">Test Save & Load</button>
    </div>

    <div class="test-section">
        <h2>Step 3: Test RLS Policies</h2>
        <div id="rls-status" class="status pending">Ready to test...</div>
        <button onclick="testRLS()">Test RLS</button>
    </div>

    <div class="test-section">
        <h2>Step 4: Run All Tests</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <pre id="results"></pre>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://iezwazccqqrhrjupxzvf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllendhemNjcXFyaHJqdXB4enZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY3NjM2MDYsImV4cCI6MjA3MjMzOTYwNn0.349EuoSQ3c1eUiMkc1fvzPfTqPKvCyWw2fLczU-ucOU";
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = supabase;

        window.checkMigration = async function() {
            const statusEl = document.getElementById('migration-status');
            statusEl.className = 'status pending';
            statusEl.textContent = 'Checking...';
            
            try {
                const { data, error } = await supabase
                    .from('team_lineups')
                    .select('team_id')
                    .limit(1);
                
                if (error) {
                    if (error.code === '42P01' || error.message.includes('does not exist')) {
                        statusEl.className = 'status error';
                        statusEl.innerHTML = `
                            <strong class="error">❌ Table does not exist!</strong><br>
                            Please apply the migration first:<br>
                            1. Go to <a href="https://supabase.com/dashboard/project/iezwazccqqrhrjupxzvf/sql/new" target="_blank" style="color: #60a5fa;">Supabase SQL Editor</a><br>
                            2. Copy SQL from: <code>supabase/migrations/20241129120511_create_team_lineups_table.sql</code><br>
                            3. Paste and run
                        `;
                    } else {
                        throw error;
                    }
                } else {
                    statusEl.className = 'status success';
                    statusEl.innerHTML = '<strong class="success">✅ Table exists! Migration applied successfully.</strong>';
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `<strong class="error">❌ Error:</strong> ${error.message}`;
            }
        };

        window.testSaveLoad = async function() {
            const statusEl = document.getElementById('save-load-status');
            statusEl.className = 'status pending';
            statusEl.textContent = 'Testing...';
            
            const testTeamId = 999; // Use a test team ID
            const testLineup = {
                starters: ['1', '2', '3'],
                bench: ['4', '5'],
                ir: ['6'],
                slotAssignments: { '1': 'slot-C-1', '2': 'slot-LW-1' }
            };

            try {
                // Save
                const { error: saveError } = await supabase
                    .from('team_lineups')
                    .upsert({
                        team_id: testTeamId,
                        starters: testLineup.starters,
                        bench: testLineup.bench,
                        ir: testLineup.ir,
                        slot_assignments: testLineup.slotAssignments
                    }, { onConflict: 'team_id' });
                
                if (saveError) throw saveError;
                
                // Load
                const { data, error: loadError } = await supabase
                    .from('team_lineups')
                    .select('*')
                    .eq('team_id', testTeamId)
                    .single();
                
                if (loadError) throw loadError;
                
                statusEl.className = 'status success';
                statusEl.innerHTML = `
                    <strong class="success">✅ Save & Load successful!</strong><br>
                    <pre style="margin-top: 10px; font-size: 11px;">${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `<strong class="error">❌ Error:</strong> ${error.message}`;
            }
        };

        window.testRLS = async function() {
            const statusEl = document.getElementById('rls-status');
            statusEl.className = 'status pending';
            statusEl.textContent = 'Testing...';
            
            try {
                const { data, error } = await supabase
                    .from('team_lineups')
                    .select('team_id');
                
                if (error) throw error;
                
                statusEl.className = 'status success';
                statusEl.innerHTML = `
                    <strong class="success">✅ RLS policies working!</strong><br>
                    Found ${data?.length || 0} team lineup(s) in database
                `;
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerHTML = `<strong class="error">❌ Error:</strong> ${error.message}`;
            }
        };

        window.runAllTests = async function() {
            const resultsEl = document.getElementById('results');
            resultsEl.textContent = 'Running all tests...\n\n';
            
            const results = [];
            
            // Test 1
            results.push('1. Checking migration...');
            await window.checkMigration();
            await new Promise(r => setTimeout(r, 500));
            results.push('   ✓ Migration check complete\n');
            
            // Test 2
            results.push('2. Testing save & load...');
            await window.testSaveLoad();
            await new Promise(r => setTimeout(r, 500));
            results.push('   ✓ Save & load test complete\n');
            
            // Test 3
            results.push('3. Testing RLS policies...');
            await window.testRLS();
            await new Promise(r => setTimeout(r, 500));
            results.push('   ✓ RLS test complete\n');
            
            results.push('\n✅ All tests completed!');
            resultsEl.textContent = results.join('\n');
        };

        // Auto-check migration on load
        window.checkMigration();
    </script>
</body>
</html>
